<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IFrame Communicator</title>
<!--
  Authorize.net Accept Hosted 전용 중계 파일 (2026-10-06).

  결제칸은 accept.authorize.net 이 그린다. 그 칸이 우리에게
  "다 됐다 / 취소했다 / 창 크기를 이만큼으로" 를 알려줄 때
  브라우저 규칙상 바로 말을 못 걸어서, 우리 도메인에 있는
  이 파일을 거쳐서 전달한다.

  하는 일은 받은 글자를 윗창에 그대로 넘기는 것뿐이다.
  이 파일은 반드시 결제 페이지와 같은 도메인에 있어야 한다.
  _headers 에서 이 주소만 X-Frame-Options 를 뗐다 - 안 그러면
  결제칸 안에서 이 파일이 안 열린다.
-->
<script type="text/javascript">
function callParentFunction(str) {
  if (typeof str !== "string" || str.length === 0) { return; }
  try {
    if (window.parent && window.parent.parent &&
        window.parent.parent.AuthorizeNetIFrame &&
        typeof window.parent.parent.AuthorizeNetIFrame.onReceiveCommunication === "function") {
      window.parent.parent.AuthorizeNetIFrame.onReceiveCommunication(str);
    }
  } catch (e) { /* 윗창이 없으면 조용히 넘어간다 */ }
}
function receiveMessage(event) {
  if (event && typeof event.data === "string" && event.data.length) {
    callParentFunction(event.data);
  }
}
if (window.addEventListener) { window.addEventListener("message", receiveMessage, false); }
else if (window.attachEvent) { window.attachEvent("onmessage", receiveMessage); }
if (window.location.hash && window.location.hash.length > 1) {
  callParentFunction(window.location.hash.substring(1));
}
</script>
</head>
<body></body>
</html>
