<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Label moved</title>
<meta http-equiv="refresh" content="3;url=https://pacific-box-label.hjbae.workers.dev/">
<style>
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef2f6;color:#1e3a5f;
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:14px;padding:34px 30px;max-width:520px;
        box-shadow:0 8px 28px rgba(30,58,95,.12);text-align:center}
  h1{font-size:22px;margin:0 0 10px}
  p{font-size:15px;line-height:1.6;color:#44607f;margin:0 0 20px}
  a.go{display:inline-block;background:#1e3a5f;color:#fff;text-decoration:none;
       font-weight:800;font-size:16px;padding:14px 22px;border-radius:10px;word-break:break-all}
  .small{font-size:12.5px;color:#8da2b8;margin-top:16px}
</style>
</head>
<body>
  <div class="card">
    <h1>The Box Label tool moved</h1>
    <p>It now lives at its own address. This page will take you there.</p>
    <a class="go" href="https://pacific-box-label.hjbae.workers.dev/">pacific-box-label.hjbae.workers.dev</a>
    <div class="small">Please update your bookmark or desktop icon.</div>
  </div>
<script>
/* 예전 service worker 와 저장본을 먼저 치우고 보낸다 - 안 그러면 이 안내문조차 안 보인다 */
(function(){
  var go = function(){ location.replace('https://pacific-box-label.hjbae.workers.dev/'); };
  if(!('serviceWorker' in navigator)){ setTimeout(go, 1200); return; }
  navigator.serviceWorker.getRegistrations().then(function(rs){
    return Promise.all(rs.map(function(r){ return r.unregister(); }));
  }).catch(function(){}).then(function(){
    return caches.keys().then(function(ns){ return Promise.all(ns.map(function(n){ return caches.delete(n); })); });
  }).catch(function(){}).then(function(){ setTimeout(go, 1200); });
})();
</script>
</body>
</html>
