<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pacific Sports — Pay Invoice</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fdfdfb;--bg:#f6f5f1;--ink:#1c1c1a;--soft-ink:#4c4a44;--faint:#8b8880;--line:#e7e4dc;--line-2:#d6d2c6;--accent:#3d5a40;--accent-soft:#eef1ec;--err:#a8463f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Geist','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{background:rgba(251,251,249,.9);border-bottom:1px solid var(--line);padding:18px 30px}
  .brand{font-family:'Instrument Serif',serif;font-size:22px;letter-spacing:.5px}
  .wrap{max-width:560px;margin:34px auto 60px;padding:0 18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
  h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;line-height:1.15}
  .sub{color:var(--faint);font-size:13.5px;margin-top:6px}
  .amt{font-family:'Instrument Serif',serif;font-size:52px;line-height:1;margin:22px 0 4px;letter-spacing:-1px}
  .amtlab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 0 7px;border-bottom:1px solid var(--line)}
  td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .btn{display:block;width:100%;margin-top:24px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:17px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sec{background:transparent;color:var(--soft-ink);border:1px solid var(--line-2);font-size:14px;padding:13px}
  .note{margin-top:16px;font-size:12px;color:var(--faint);line-height:1.6;text-align:center}
  .msg{margin-top:18px;padding:13px 15px;border-radius:10px;font-size:13.5px;line-height:1.5}
  .msg.bad{background:#fbf0ef;border:1px solid #e6c5c2;color:var(--err)}
  .msg.good{background:var(--accent-soft);border:1px solid #c8d6c9;color:var(--accent)}
  .paidbox{margin-top:22px;padding:20px;border-radius:12px;background:var(--accent-soft);border:1px solid #c8d6c9;text-align:center}
  .paidbox .big{font-family:'Instrument Serif',serif;font-size:27px;color:var(--accent)}
  .paidbox .sm{font-size:12.5px;color:var(--soft-ink);margin-top:7px;line-height:1.6}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #lb{position:fixed;inset:0;background:rgba(28,28,26,.72);z-index:90;display:none;align-items:center;justify-content:center;padding:14px}
  #lb.on{display:flex}
  #lbin{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:94vh;overflow:hidden;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  #lbf{width:100%;height:760px;border:0;display:block}
  #lbx{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.92);border:1px solid var(--line-2);border-radius:8px;width:30px;height:30px;font-size:16px;line-height:1;cursor:pointer;color:var(--soft-ink);z-index:2}
  footer{text-align:center;color:var(--faint);font-size:11.5px;padding:0 18px 40px;line-height:1.7}
  @media(max-width:520px){ .amt{font-size:42px} .wrap{margin-top:22px} header{padding:15px 18px} }
</style>
</head>
<body>

<header><div class="brand">Pacific Sports</div></header>

<div class="wrap">
  <div class="card" id="card">
    <div class="sub" id="boot">Loading…</div>
  </div>
  <footer id="foot"></footer>
</div>

<div id="lb"><div id="lbin">
  <button id="lbx" type="button" title="Close">&times;</button>
  <iframe id="lbf" name="payframe" frameborder="0" scrolling="no"></iframe>
</div></div>

<form id="payform" method="post" target="payframe" action="https://accept.authorize.net/payment/payment" style="display:none">
  <input type="hidden" name="token" id="ptok">
</form>

<script>
/* Pacific Sports 결제 링크 페이지 (2026-09-28)
   손님이 인보이스를 카드로 내는 화면. 로그인 없다.
   카드 번호는 이 페이지에 절대 들어오지 않는다 - Authorize.Net 창 안에서만 친다.
   금액도 이 페이지가 정하지 않는다 - 서버가 DB 에서 읽은 값만 쓴다. */
(function () {
  var API = 'https://payreq.hjbae.workers.dev';
  var TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
  var card = document.getElementById('card');
  var lb = document.getElementById('lb');
  var lbf = document.getElementById('lbf');
  var state = null;
  var busy = false;

  function esc(s){ return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function money(n){ return '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function foot(t){ document.getElementById('foot').innerHTML = t || ''; }

  function showError(t){
    card.innerHTML = '<h1>Payment link</h1><div class="msg bad">' + esc(t) + '</div>'
      + '<div class="note">Questions? Reply to the email this link came from and we will help.</div>';
    foot('');
  }

  function itemRows(items){
    if(!items || !items.length) return '';
    var r = '<table><thead><tr><th>Invoice</th><th>PO</th><th style="text-align:right">Amount</th></tr></thead><tbody>';
    for(var i=0;i<items.length;i++){
      var it = items[i] || {};
      r += '<tr><td>' + esc(it.invNo || '-') + '</td><td>' + esc(it.po || '-') + '</td>'
         + '<td class="n">' + money(it.amount) + '</td></tr>';
    }
    return r + '</tbody></table>';
  }

  function showPaid(s){
    card.innerHTML = '<h1>Thank you</h1>'
      + '<div class="sub">' + esc(s.cust || '') + '</div>'
      + '<div class="paidbox"><div class="big">' + money(s.amount) + ' paid</div>'
      + '<div class="sm">'
      + (s.acct ? ('Card ending ' + esc(s.acct) + '<br>') : '')
      + (s.authCode ? ('Approval ' + esc(s.authCode) + '<br>') : '')
      + (s.paidAt ? new Date(s.paidAt).toLocaleString('en-US') : '')
      + '</div></div>'
      + itemRows(s.items)
      + '<div class="note">A receipt has been recorded on your account. You can close this page.</div>';
    foot('');
  }

  function showPay(s){
    card.innerHTML = '<h1>Pay your invoice</h1>'
      + '<div class="sub">' + esc(s.cust || '') + '</div>'
      + '<div class="amtlab" style="margin-top:20px">Amount due</div>'
      + '<div class="amt">' + money(s.amount) + '</div>'
      + itemRows(s.items)
      + (s.note ? '<div class="note" style="text-align:left">' + esc(s.note) + '</div>' : '')
      + '<button class="btn" id="go" type="button">Pay by credit card</button>'
      + '<div id="slot"></div>'
      + '<div class="note">Your card is entered on Authorize.Net’s secure form.<br>'
      + 'Pacific Sports never sees or stores your card number.</div>';
    document.getElementById('go').onclick = go;
    foot('Pacific Sports &middot; Peace Textile America Inc.');
  }

  function say(kind, t){
    var slot = document.getElementById('slot');
    if(slot) slot.innerHTML = '<div class="msg ' + kind + '">' + esc(t) + '</div>';
  }

  async function load(){
    if(!TOKEN){ showError('This payment link is not valid.'); return; }
    var j = null;
    try{
      var r = await fetch(API + '/status?t=' + encodeURIComponent(TOKEN), { cache:'no-store' });
      j = await r.json();
    }catch(e){ showError('We could not reach our payment service. Please try again in a moment.'); return; }
    if(!j || !j.ok){ showError((j && j.error) || 'This payment link is not valid.'); return; }
    state = j;
    if(j.status === 'paid'){ showPaid(j); return; }
    if(j.status !== 'pending'){ showError('This payment link is closed. Please contact us for a new one.'); return; }
    if(j.expiresAt && new Date(j.expiresAt).getTime() < Date.now()){
      showError('This payment link has expired. Please contact us for a new one.'); return; }
    showPay(j);
  }

  async function go(){
    if(busy) return;
    busy = true;
    var b = document.getElementById('go');
    if(b){ b.disabled = true; b.innerHTML = '<span class="spin"></span>Opening secure form…'; }
    say('good', '');
    var j = null;
    try{
      var r = await fetch(API + '/start', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token: TOKEN }) });
      j = await r.json();
    }catch(e){ j = { ok:false, error:'We could not reach our payment service. Please try again.' }; }
    if(!j || !j.ok || !j.formToken){
      busy = false;
      if(b){ b.disabled = false; b.textContent = 'Pay by credit card'; }
      if(j && j.paid){ load(); return; }
      say('bad', (j && j.error) || 'We could not open the payment form. Please try again.');
      return;
    }
    document.getElementById('ptok').value = j.formToken;
    lb.classList.add('on');
    document.getElementById('payform').submit();
    if(b){ b.disabled = false; b.textContent = 'Pay by credit card'; }
    busy = false;
  }

  function closeLb(){
    lb.classList.remove('on');
    try{ lbf.src = 'about:blank'; }catch(e){}
  }
  document.getElementById('lbx').onclick = function(){ closeLb(); };

  /* Authorize.Net 결제창이 ifc.html 을 거쳐 결과를 보내온다.
     우리 주소에서 온 것만 받는다. */
  window.addEventListener('message', async function (ev) {
    if(ev.origin !== window.location.origin) return;
    if(typeof ev.data !== 'string' || !ev.data) return;
    var p;
    try{ p = new URLSearchParams(ev.data); }catch(e){ return; }
    var action = p.get('action') || '';

    if(action === 'resizeWindow'){
      var h = parseInt(p.get('height'), 10);
      if(h > 200 && h < 3000) lbf.style.height = (h + 24) + 'px';
      return;
    }
    if(action === 'cancel'){ closeLb(); return; }
    if(action !== 'transactResponse') return;

    var res = null;
    try{ res = JSON.parse(p.get('response') || '{}'); }catch(e){ res = {}; }
    var transId = String(res.transId || (res.transactionResponse && res.transactionResponse.transId) || '').trim();

    closeLb();
    card.innerHTML = '<h1>Checking your payment…</h1>'
      + '<div class="sub">One moment — please do not close this page.</div>';

    if(!transId){
      showError('We did not get a transaction number back. If your card was charged, contact us before trying again.');
      return;
    }
    var c = null;
    for(var attempt = 0; attempt < 3; attempt++){
      try{
        var r2 = await fetch(API + '/confirm', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token: TOKEN, transId: transId }) });
        c = await r2.json();
        if(c && c.ok) break;
      }catch(e){ c = null; }
      await new Promise(function(z){ setTimeout(z, 1200); });
    }
    if(c && c.ok){
      showPaid({ cust: (state && state.cust) || '', amount: c.amount, acct: c.acct,
                 authCode: c.authCode, paidAt: new Date().toISOString(),
                 items: (state && state.items) || [] });
      return;
    }
    showError('Your card may have gone through, but we could not record it automatically. '
      + 'Please contact us with transaction number ' + transId + ' before paying again.');
  }, false);

  load();
})();
</script>
</body>
</html>
